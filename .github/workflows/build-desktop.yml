name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.os }} Desktop App
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install --save-dev electron electron-builder

      - name: Build web application
        run: npm run build

      - name: Build Windows Executable (.exe)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux Binaries (.AppImage & .deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "CapturePro PC v1.0.0 — Screen Recorder & Snipping Studio"
          body: |
            ## CapturePro PC v1.0.0 Desktop Release

            ### Available Binaries:
            - **Windows**: `CapturePro-Setup-1.0.0.exe` (Installer) & `CapturePro-1.0.0-portable.exe` (Portable)
            - **Linux**: `CapturePro-1.0.0.AppImage` (Universal Linux) & `CapturePro_1.0.0_amd64.deb` (Debian/Ubuntu)

            ### Features:
            - Hardware-accelerated 4K & 1080p 60 FPS PC Screen Recording
            - Draggable Webcam Picture-in-Picture Bubble (Circle, Rounded, Square)
            - Dual Audio Mixing (PC System Audio + Microphone)
            - Snipping Tool with Step Badges, Blur Redaction, and Clipboard Copy
            - Video Trimming Studio and Audio WAV Extractor
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
