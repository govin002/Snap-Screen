<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Display Frame -->
  <rect x="76" y="96" width="360" height="240" rx="24" fill="#0f172a" stroke="#818cf8" stroke-width="12" />
  
  <!-- Screen Stand -->
  <path d="M226 336 L286 336 L306 400 L206 400 Z" fill="#6366f1" />
  <rect x="176" y="400" width="160" height="16" rx="8" fill="#818cf8" />
  
  <!-- Recording Red Dot Indicator -->
  <circle cx="120" cy="140" r="14" fill="url(#accent)" />
  
  <!-- Centered Play / Record Icon -->
  <polygon points="230,175 320,225 230,275" fill="#ffffff" />
</svg>
